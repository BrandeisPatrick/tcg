<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Deadlock TCG</title>
    <meta name="description" content="A fan-made Deadlock card game. Draft three heroes, build a deck of Deadlock's items and fight for the lane. Free, in your browser. Not affiliated with Valve." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://brandeispatrick.github.io/tcg/" />

    <!-- The link preview: what a chat app, a forum or a feed shows when the
         game's link is pasted. A crawler runs no script, so these are plain
         tags with the whole address, and one picture answers every link
         into the game. The picture is public/link-preview.jpg, baked by
         scripts/art/bake_link_preview.mjs (docs/sharing.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Deadlock TCG" />
    <meta property="og:title" content="Deadlock TCG: a fan-made card game" />
    <meta property="og:description" content="Draft three heroes, build a deck of Deadlock's items and fight for the lane. Free, in your browser. Unofficial fan project." />
    <meta property="og:url" content="https://brandeispatrick.github.io/tcg/" />
    <meta property="og:image" content="https://brandeispatrick.github.io/tcg/link-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Get dealt into Deadlock, a fan-made card game: five hero cards fanned under the title." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deadlock TCG: a fan-made card game" />
    <meta name="twitter:description" content="Draft three heroes, build a deck of Deadlock's items and fight for the lane. Free, in your browser. Unofficial fan project." />
    <meta name="twitter:image" content="https://brandeispatrick.github.io/tcg/link-preview.jpg" />
    <meta name="twitter:image:alt" content="Get dealt into Deadlock, a fan-made card game: five hero cards fanned under the title." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
